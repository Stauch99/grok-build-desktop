name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webkit deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Grok Build v__VERSION__"
          releaseBody: |
            Prebuilt installers for macOS (Apple Silicon + Intel), Windows, and Linux.

            This app has no in-app auto-update — download a new build when you want one.
            You still need at least one ACP CLI installed and logged in (Grok, Kimi, Claude Code, or Codex).

            macOS Gatekeeper may warn because these builds are unsigned. Open anyway via System Settings → Privacy & Security, or `xattr -cr /Applications/Grok Build.app`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: publish-tauri
    runs-on: ubuntu-22.04
    name: Publish SHA256SUMS
    steps:
      - uses: actions/checkout@v4
      - name: Compute and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          fi
          mkdir -p /tmp/release-assets
          cd /tmp/release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' || true
          rm -f SHA256SUMS
          shopt -s nullglob
          files=(*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "error: no release assets found for $TAG" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
