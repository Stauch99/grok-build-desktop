name: Feature request
description: A change to the workbench, hub, or an ACP adapter.
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Please read [docs/HANDOFF.md](https://github.com/Stauch99/grok-build-desktop/blob/feat/multi-agent-workbench/docs/HANDOFF.md). Features that move the model loop into the desktop will be declined.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: Smallest change that would help. Name the layer (AgentPort, AgentHost, UI chrome, adapter).
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - AgentPort / session UI
        - AgentHost / adapters
        - Skills / MCP store
        - Git / explorer / preview
        - Docs
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Contract
      options:
        - label: This keeps runtime in the CLI (ACP stdio).
          required: true
        - label: I am willing to add tests next to the module.
          required: false
