[package]
name = "grok-build-webui"
version = "0.6.3"
description = "WebUI desktop client for Grok Build"
authors = ["Stauch"]
edition = "2021"
default-run = "grok-build-webui"

[lib]
name = "grok_build_webui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "memory-mcp"
path = "src/bin/memory-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
thiserror = "2"
toml_edit = "0.22"
walkdir = "2"
notify = "7"
fs2 = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
